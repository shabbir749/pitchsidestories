<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitch Side Stories - Link in Bio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1527;
            background-image: radial-gradient(circle at 50% 20%, #16233f 0%, #0d1527 80%);
            min-height: 100vh;
        }

        /* Glassmorphism Card Container */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Subtle Pulse Effect on Main CTA */
        @keyframes pulse-subtle {
            0% {
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4);
            }
            70% {
                box-shadow: 0 0 0 14px rgba(225, 29, 72, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(225, 29, 72, 0);
            }
        }

        .pulse-cta {
            animation: pulse-subtle 2.2s infinite;
        }

        /* Responsive Click/Hover Animation */
        .btn-interact {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-interact:hover {
            transform: translateY(-2px);
        }

        .btn-interact:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 min-h-screen text-slate-100 selection:bg-rose-500 selection:text-white">

    <!-- Main Container Card -->
    <div class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center text-center my-auto relative overflow-hidden">
        
        <!-- Ambient Background Glows -->
        <div class="absolute -top-20 -left-20 w-44 h-44 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-44 h-44 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Avatar Container with Vector Logo -->
        <div class="relative mb-5">
            <div class="w-28 h-28 rounded-full bg-[#0d1527] border-2 border-slate-700/80 shadow-2xl flex items-center justify-center p-3.5 relative z-10">
                <!-- Pitch Side Stories SVG Graphic -->
                <svg viewBox="0 0 100 100" class="w-full h-full stroke-white fill-none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <!-- Football Pitch -->
                    <path d="M 20,40 L 35,90 L 65,90 L 80,40 Z" />
                    <!-- Center Line and Circle -->
                    <line x1="28" y1="65" x2="72" y2="65" />
                    <circle cx="50" cy="65" r="7" />
                    <!-- Penalty Area -->
                    <path d="M 38,90 L 38,76 L 62,76 L 62,90" />
                    <path d="M 43,90 L 43,84 L 57,84 L 57,90" />
                    <!-- Corner Lines -->
                    <path d="M 23,43 L 26,43" />
                    <path d="M 77,43 L 74,43" />
                    <path d="M 33,87 L 35,87" />
                    <path d="M 67,87 L 65,87" />

                    <!-- Microphone Overlay -->
                    <rect x="43" y="18" width="14" height="22" rx="7" fill="#0d1527" />
                    <line x1="43" y1="24" x2="57" y2="24" stroke-width="1.5" />
                    <line x1="43" y1="29" x2="57" y2="29" stroke-width="1.5" />
                    <line x1="43" y1="34" x2="57" y2="34" stroke-width="1.5" />
                    <path d="M 40,28 L 40,38 C 40,44 60,44 60,38 L 60,28" />
                    <line x1="50" y1="44" x2="50" y2="52" stroke-width="3" />
                </svg>
            </div>
            <span class="absolute bottom-1 right-1 z-20 bg-emerald-500 border-2 border-[#0d1527] w-3.5 h-3.5 rounded-full" title="Online"></span>
        </div>

        <!-- Title & Bio (100% English) -->
        <h1 class="text-2xl font-extrabold text-white tracking-wide uppercase">Pitch Side Stories</h1>
        <p class="text-xs font-semibold text-sky-400 tracking-widest uppercase mt-1 mb-3">Football • News • Highlights</p>
        <p class="text-xs text-slate-300 max-w-xs mb-7 leading-relaxed">
            Your ultimate hub for match highlights, football stories, and pitch-side commentary.
        </p>

        <!-- Buttons Container -->
        <div class="w-full space-y-3.5">
            
            <!-- 1. PRIMARY BUTTON: Watch Highlights -->
            <a 
                href="https://cutt.ly/AyvQuRtm" 
                target="_blank" 
                rel="noopener noreferrer"
                class="pulse-cta w-full py-4 px-5 rounded-2xl bg-gradient-to-r from-rose-600 via-red-600 to-rose-500 hover:from-rose-500 hover:to-red-500 text-white font-bold text-sm sm:text-base flex items-center justify-between shadow-lg btn-interact border border-rose-400/30"
            >
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-play text-white text-sm"></i>
                    </div>
                    <span class="tracking-wide">Watch Highlights</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-white/80"></i>
            </a>

            <!-- 2. SECONDARY BUTTON: Facebook Page -->
            <a 
                href="https://www.facebook.com/pitchsidestorieslive/" 
                target="_blank" 
                rel="noopener noreferrer"
                class="w-full py-3.5 px-5 rounded-2xl bg-slate-800/80 hover:bg-slate-800 text-slate-100 font-semibold text-sm flex items-center justify-between border border-slate-700/60 shadow-md btn-interact group"
            >
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center text-lg shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <span>Facebook Page</span>
                </div>
                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:translate-x-1 transition-transform"></i>
            </a>

        </div>

        <!-- Simple Footer -->
        <footer class="mt-8 text-[11px] text-slate-400/70 tracking-wide">
            © Pitch Side Stories
        </footer>

    </div>

</body>
</html>
